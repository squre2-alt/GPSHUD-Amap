name: Build GPSHUD Tweak

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build on macOS
    runs-on: macos-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          brew install dpkg ldid xz

      - name: Install Theos
        run: |
          git clone --recurse-submodules --depth=1 https://github.com/theos/theos.git "$HOME/theos"
          echo "THEOS=$HOME/theos" >> "$GITHUB_ENV"
          echo "$HOME/theos/bin" >> "$GITHUB_PATH"

      - name: Verify toolchain
        run: |
          echo "Xcode: $(xcode-select -p)"
          clang --version | head -2
          dpkg-deb --version | head -1
          echo "THEOS=$THEOS"

      - name: Build package
        run: |
          make clean || true
          make package

      - name: Collect artifacts
        run: |
          mkdir -p artifacts
          find . -maxdepth 3 -name '*.deb' -path './packages/*' -exec cp {} artifacts/ \;
          find .theos -name 'GPSHUD.dylib' -exec cp {} artifacts/ \; 2>/dev/null || true
          ls -la artifacts/

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: GPSHUD-build
          path: artifacts/*
          if-no-files-found: error
          retention-days: 90

      - name: Attach artifacts to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
